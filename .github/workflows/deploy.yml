name: AuditChain Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          VPS_ENV: ${{ secrets.VPS_ENV }}
        with:
          host: 13.140.166.97
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_ENV
          command_timeout: 30m
          script: |
            set -e

            APP_DIR=/opt/auditchain

            # Clone on first deploy, pull on subsequent deploys
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" pull origin main
            else
              rm -rf "$APP_DIR"
              git clone https://github.com/leopbar/auditchain.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Write .env from GitHub secret
            printf '%s' "$VPS_ENV" > .env

            # Build and restart containers
            docker compose -f docker-compose.prod.yml up -d --build

            # Clean up unused images
            docker image prune -f
